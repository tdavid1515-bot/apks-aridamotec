name: Auto-Sync Catalogo y Codigos Browsy

on:
  release:
    types: [published, created, edited, deleted]
  push:
    branches:
      - main
    paths:
      - '**.apk'
      - 'version.json'
  workflow_dispatch:
  repository_dispatch:
    types: [apk_upload, release_change]
  schedule:
    # Chequeo programado cada 5 minutos para detectar automáticamente inclusiones o borrados en GitHub Releases
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar motor de sincronización y Browsy API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install Pillow || true
          node sync_catalog.js
          python extract_icons.py || true

      - name: Confirmar y publicar cambios si hay nuevas APKs o códigos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A catalog.json data/catalog.json version.json data/version.json icons/ app/src/main/assets/icons/ app/src/main/assets/apk_metadata.json index.html admin.html gas/Admin.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync: sincronización automática de catálogo, códigos Browsy, iconos y versión [skip ci]"
            git push origin main
            echo "✅ Catálogo y versión actualizados y publicados en GitHub Pages."
          else
            echo "ℹ️ No se detectaron nuevas APKs ni códigos pendientes."
          fi
