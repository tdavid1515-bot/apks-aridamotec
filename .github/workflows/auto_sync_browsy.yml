name: Auto-Sync Catalogo y Codigos Browsy

on:
  release:
    types: [published, created, edited, deleted]
  push:
    branches:
      - main
    paths:
      - '**.apk'
      - 'version.json'
  workflow_dispatch:
  schedule:
    # Chequeo programado cada 15 minutos para detectar automáticamente inclusiones o borrados en GitHub Releases
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar motor de sincronización y Browsy API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node sync_catalog.js

      - name: Confirmar y publicar cambios si hay nuevas APKs o códigos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain catalog.json version.json index.html admin.html invitado.html)" ]; then
            git add catalog.json data/catalog.json version.json data/version.json index.html admin.html invitado.html
            git commit -m "Auto-sync: generación automática de códigos Browsy para nuevas APKs [skip ci]"
            git push origin main
            echo "✅ Catálogo actualizado y publicado con nuevos códigos Browsy."
          else
            echo "ℹ️ No se detectaron nuevas APKs ni códigos pendientes."
          fi
